<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Octocat service app</title>
    <link rel="stylesheet" type="text/css" href="styles/style.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@freshworks/crayons@v4/css/crayons-min.css" />
    <script type="module" src="https://cdn.jsdelivr.net/npm/@freshworks/crayons@v4/dist/crayons/crayons.esm.js"></script>
    <script nomodule src="https://cdn.jsdelivr.net/npm/@freshworks/crayons@v4/dist/crayons/crayons.js"></script>
    <script src="{{{appclient}}}"></script>
  </head>
  <body>
    <section class="app-body">
      <picture>
        <img src="./styles/images/banner.png" alt="Octocat and Freshservice" width="275" />
      </picture>
      <fw-button class="create-issue">Create issue on GitHub</fw-button>
      <fw-button class="issue-details" color="link">View issue details</fw-button>
    </section>
    <script defer src="scripts/app.js"></script>
  </body>
</html>
